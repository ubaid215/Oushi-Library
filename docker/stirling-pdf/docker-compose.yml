# Stirling PDF — self-hosted PDF toolkit
# Run locally:  docker-compose up -d
# Then set in .env.local: STIRLING_PDF_URL=http://localhost:8080

services:
  stirling-pdf:
    image: frooodle/s-pdf:latest
    container_name: stirling-pdf
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - stirling_configs:/configs
      - stirling_logs:/logs
    environment:
      # Set to true + configure users.json if exposed to the public internet
      DOCKER_ENABLE_SECURITY: "false"
      # JVM memory — increase to 1g if processing many large PDFs concurrently
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/info/status"]
      interval: 30s
      timeout:  10s
      retries:  3
      start_period: 40s

volumes:
  stirling_configs:
  stirling_logs: